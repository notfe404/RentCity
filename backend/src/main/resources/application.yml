server:
  port: 8081
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5434/rentcity}
    username: ${SPRING_DATASOURCE_USERNAME:rentcity_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rentcity_pass}
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        schema_update.enum_check: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 1 day in milliseconds

payment:
  public-base-url: http://localhost:8081/api

booking:
  payment-hold-minutes: 15
  expiration-check-delay-ms: 5000
