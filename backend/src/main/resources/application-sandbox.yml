server:
  port: 8081
  servlet:
    context-path: /api

spring:
  profiles:
    active: sandbox
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5434/rentcity}
    username: ${SPRING_DATASOURCE_USERNAME:rentcity_user}
    password: ${SPRING_DATASOURCE_PASSWORD:rentcity_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 1 day in milliseconds

# ============================================================
# PayPal Sandbox Configuration
# ============================================================
paypal:
  client-id: ${paypal.client-id:${PAYPAL_CLIENT_ID:YOUR_PAYPAL_CLIENT_ID}}
  client-secret: ${paypal.client-secret:${PAYPAL_CLIENT_SECRET:YOUR_PAYPAL_CLIENT_SECRET}}
  mode: ${paypal.mode:sandbox}
  api-url: ${paypal.api-url:https://api.sandbox.paypal.com}
  return-url: ${paypal.return-url:http://localhost:5173/booking/result}
  cancel-url: ${paypal.cancel-url:http://localhost:5173/payments}
  currency: ${paypal.currency:USD}

# ============================================================
# VNPay Sandbox Configuration
# ============================================================
vnpay:
  tmn-code: ${vnpay.tmn-code:${VNPAY_TMN_CODE:YOUR_VNPAY_TMN_CODE}}
  secret-key: ${vnpay.secret-key:${VNPAY_SECRET_KEY:YOUR_VNPAY_SECRET_KEY}}
  api-url: ${vnpay.api-url:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${vnpay.return-url:http://localhost:8081/api/payments/vnpay/callback}
  command: ${vnpay.command:pay}
  order-type: ${vnpay.order-type:100000}
  currency: ${vnpay.currency:VND}
  locale: ${vnpay.locale:vn}
  timeout: ${vnpay.timeout:15}
  version: ${vnpay.version:2.1.0}

# ============================================================
# Payment Service Configuration
# ============================================================
payment:
  public-base-url: ${payment.public-base-url:http://localhost:8081/api}
  min-deposit-percent: ${payment.min-deposit-percent:50}
  max-deposit-percent: ${payment.max-deposit-percent:100}

logging:
  level:
    com.rentcity: DEBUG
    org.springframework.web: INFO
